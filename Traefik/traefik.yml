# =============================================================================
# Traefik — Static Configuration
# =============================================================================
# این فایل فقط در زمان استارت خوانده می‌شود.
# برای تغییر روت‌ها فایل dynamic/routes.yml را ویرایش کنید (بدون ری‌استارت).
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ─── Entry Points ────────────────────────────────────────────────────────────
# web     → همان پورت گیتوی قدیمی (۹۰۰۰)؛ تمام ترافیک API از اینجا می‌گذرد.
# traefik → پورت داشبورد (۸۰۸۰).
entryPoints:
  web:
    address: ":9000"
  traefik:
    address: ":8080"

# ─── Provider ────────────────────────────────────────────────────────────────
# فایل‌های داخل dynamic/ به‌صورت زنده (watch) خوانده می‌شوند.
providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# ─── Dashboard / API ─────────────────────────────────────────────────────────
# insecure=true فقط برای توسعه: داشبورد بدون احراز هویت روی :8080.
# در پروداکشن این را false کنید و یک router امن با middleware اضافه کنید.
api:
  dashboard: true
  insecure: true

# ─── Ping (برای healthcheck) ────────────────────────────────────────────────
# روی entrypoint به‌نام traefik و مسیر /ping در دسترس است.
ping:
  entryPoint: traefik

# ─── Logging ─────────────────────────────────────────────────────────────────
log:
  level: INFO          # DEBUG | INFO | WARN | ERROR
  format: common

accessLog: {}
