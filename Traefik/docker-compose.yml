# =============================================================================
# MiniSource Gateway — Traefik (drop-in replacement for the Go gateway)
# =============================================================================
# اجرا:
#   docker compose up -d
# توقف:
#   docker compose down
#
# سرویس‌های backend باید روی هاست در حال اجرا باشند:
#   auth    → 127.0.0.1:9001
#   payment → 127.0.0.1:5010
# Traefik از داخل کانتینر از طریق host.docker.internal به آن‌ها وصل می‌شود.
# =============================================================================

services:
  traefik:
    image: traefik:v3.2
    container_name: minisource-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "9000:9000"   # API gateway (جایگزین پورت گیتوی قدیمی)
      - "8080:8080"   # داشبورد Traefik
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    # اجازه دسترسی کانتینر به سرویس‌های روی هاست (127.0.0.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
