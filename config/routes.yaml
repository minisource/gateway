routes:
  # ============================================
  # Authentication Routes (Public)
  # ============================================
  - path: /api/v1/auth/login
    service: auth
    stripPrefix: false
    methods: [POST]
    public: true
    circuitBreaker: true
    rateLimit:
      requestsPerSec: 10
      burstSize: 20

  - path: /api/v1/auth/register
    service: auth
    stripPrefix: false
    methods: [POST]
    public: true
    circuitBreaker: true
    rateLimit:
      requestsPerSec: 5
      burstSize: 10

  - path: /api/v1/auth/refresh
    service: auth
    stripPrefix: false
    methods: [POST]
    public: true
    circuitBreaker: true

  - path: /api/v1/auth/verify-email
    service: auth
    stripPrefix: false
    methods: [POST, GET]
    public: true
    circuitBreaker: true

  - path: /api/v1/auth/forgot-password
    service: auth
    stripPrefix: false
    methods: [POST]
    public: true
    circuitBreaker: true
    rateLimit:
      requestsPerSec: 3
      burstSize: 5

  - path: /api/v1/auth/reset-password
    service: auth
    stripPrefix: false
    methods: [POST]
    public: true
    circuitBreaker: true

  # ============================================
  # Authentication Routes (Protected)
  # ============================================
  - path: /api/v1/auth
    service: auth
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/auth/logout
    service: auth
    stripPrefix: false
    methods: [POST]
    public: false
    circuitBreaker: true

  - path: /api/v1/auth/me
    service: auth
    stripPrefix: false
    methods: [GET]
    public: false
    circuitBreaker: true

  - path: /api/v1/auth/change-password
    service: auth
    stripPrefix: false
    methods: [POST]
    public: false
    circuitBreaker: true

  # ============================================
  # User Management Routes
  # ============================================
  - path: /api/v1/users
    service: auth
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  # ============================================
  # Role & Permission Routes
  # ============================================
  - path: /api/v1/roles
    service: auth
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE]
    public: false
    circuitBreaker: true

  - path: /api/v1/permissions
    service: auth
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE]
    public: false
    circuitBreaker: true

  # ============================================
  # Service-specific Admin Routes (before auth catch-all)
  # ============================================
  - path: /api/v1/admin/agents
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/departments
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/sla-policies
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/canned-responses
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/dashboard
    service: ticket
    stripPrefix: false
    methods: [GET]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/tickets
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/categories
    service: ticket
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/stats
    service: feedback
    stripPrefix: false
    methods: [GET]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/settings
    service: feedback
    stripPrefix: false
    methods: [GET, PUT, POST]
    public: false
    circuitBreaker: true

  - path: /api/v1/admin/feedback
    service: feedback
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  # Auth admin catch-all (users, roles, permissions, service-clients)
  - path: /api/v1/admin
    service: auth
    stripPrefix: false
    methods: [GET, POST, PUT, DELETE, PATCH]
    public: false
    circuitBreaker: true

  # ============================================
  # Notification Routes
  # ============================================
  - path: /api/v1/notifications
    service: notifier
    stripPrefix: false
