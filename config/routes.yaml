    circuitBreaker: true

  - path: /api/v1/notifications/send
    service: notifier
    stripPrefix: false
    methods: [POST]
    public: false
    circuitBreaker: true
    rateLimit:
      requestsPerSec: 50
      burstSize: 100

  # ============================================
