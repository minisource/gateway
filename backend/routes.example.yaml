      methods: [GET]

    - id: auth-logout
      pathPrefix: /v1/auth/logout
      upstream: auth
      upstreamPathPrefix: /v1/auth/logout
      policy: authenticated
      methods: [POST]

    - id: auth-other
      pathPrefix: /v1/auth
      upstream: auth
      upstreamPathPrefix: /v1/auth
      policy: authenticated
      methods: [GET, POST, PUT, PATCH, DELETE]

    - id: example-service
      pathPrefix: /v1
      upstream: example-service
      upstreamPathPrefix: /v1
      policy: authenticated
      methods: [GET, POST, PUT, PATCH, DELETE]
