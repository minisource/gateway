version: "3.8"

# =============================================================================
# MiniSource API Gateway — Independent Docker Compose Stack
# =============================================================================
# Services:
#   - gateway: API Gateway Go Proxy (External Port 8080)
#
# Routes all public and authenticated requests for Auth, Notifier, and Frontends.
#
# Usage:
#   docker compose up -d --build
# =============================================================================

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/backend/Dockerfile
    container_name: minisource-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - AUTH_SERVICE_URL=http://minisource-auth-backend:9001
      - NOTIFIER_SERVICE_URL=http://minisource-notifier-backend:9002
      - AUTH_FRONTEND_URL=http://minisource-auth-frontend:3003
      - NOTIFIER_FRONTEND_URL=http://minisource-notifier-frontend:3004
      - REDIS_HOST=minisource-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - JWT_SECRET=change-me-in-production
      - GATEWAY_LOG_LEVEL=info
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://minisource-otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=minisource
    networks:
      - minisource-network

networks:
  minisource-network:
    name: minisource-network
    external: true
