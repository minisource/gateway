name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  backend:
    name: Backend Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=mod

      - name: Test (non-fatal)
        run: go test -count=1 -timeout 120s ./... 2>/dev/null || echo "Tests skipped or failed (non-fatal)"
        env:
          GOFLAGS: -mod=mod
        continue-on-error: true

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=mod

  docker:
    name: Docker Publish
    needs: backend
    uses: minisource/.github/.github/workflows/docker-release.yml@main
    with:
      image-name: minisource/gateway
      dockerfile-path: backend/Dockerfile
      build-context: .
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
