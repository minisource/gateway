name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            gofmt -s -l .
            exit 1
          fi
        env:
          GOFLAGS: -mod=mod

      - name: Verify modules
        run: go mod verify
        env:
          GOFLAGS: -mod=mod

      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=mod

      - name: Test
        run: go test -race -count=1 -timeout 300s ./...
        env:
          GOFLAGS: -mod=mod

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=mod

  docker:
    name: Docker
    needs: backend
    uses: minisource/.github/.github/workflows/build-and-push.yml@main
    with:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/gateway
      dockerfile-path: backend/Dockerfile
      build-context: .
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
